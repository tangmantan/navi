# GitHub Pages 自动部署工作流
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write # Pages 部署要求 OIDC 令牌

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20 # 与 package.json engines 要求一致
          cache: npm

      - name: Compute base path
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_OVERRIDE: ${{ vars.VITE_BASE }}
        run: |
          if [ -n "$BASE_OVERRIDE" ]; then
            echo "base=$BASE_OVERRIDE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          REPO="${GITHUB_REPOSITORY#*/}"
          CNAME=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.cname // ""' 2>/dev/null || echo "")

          if [[ "$REPO" == *.github.io ]] || [ -n "$CNAME" ]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$REPO/" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Ensure config.json exists
        run: |
          [ -f config.json ] || cp config.json.example config.json

      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ steps.base.outputs.base }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
